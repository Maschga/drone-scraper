<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="drone-scraper – Preisverlauf für iFlight Nazgul und GEPRC Vapor FPV-Drohnen."
  >
  <title>drone-scraper</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --bg: #090b10; --panel: #11151d; --panel2: #151a24;
      --border: #252c39; --text: #f4f6fa; --muted: #9da7b8;
      --accent: #8df0c4; --warn: #ffd98d; --danger: #ff8d8d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg); }
    .shell { width: min(1320px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 56px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(38px, 6vw, 70px); letter-spacing: -0.05em; }
    .subtitle { max-width: 820px; margin: 12px 0 0; color: var(--muted); line-height: 1.55; }
    button { min-height: 42px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); background: var(--panel2); cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .55; cursor: wait; }
    .overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat, .card, .chart-panel { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); }
    .stat { padding: 16px; }
    .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .stat-value { margin-top: 8px; font-size: 28px; font-weight: 850; }
    .section { margin-top: 26px; }
    .section h2 { margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .card { padding: 20px; }
    .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .shop { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .badge { padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; border: 1px solid var(--border); }
    .available { color: var(--accent); }
    .unavailable { color: var(--warn); }
    .card h3 { min-height: 2.5em; margin: 18px 0 0; }
    .price { margin-top: 18px; font-size: clamp(34px, 5vw, 48px); font-weight: 900; letter-spacing: -0.05em; }
    .price-note { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .discount { display: inline-block; margin-top: 9px; padding: 6px 9px; border-radius: 8px; color: var(--accent); background: rgba(141, 240, 196, .08); font-size: 11px; font-weight: 800; }
    .meta { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .meta strong { color: var(--text); text-align: right; }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; align-items: center; }
    .footer a { color: var(--text); font-weight: 800; text-decoration: none; }
    .error { color: var(--danger); font-size: 11px; }
    .chart-panel { padding: 16px; }
    .controls { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
    .ranges { display: flex; gap: 8px; flex-wrap: wrap; }
    .ranges button.active { background: var(--text); color: var(--bg); }
    label { color: var(--muted); font-size: 12px; font-weight: 700; }
    #chart { min-height: 500px; }
    .status { margin-top: 12px; color: var(--muted); font-size: 12px; }
    @media (max-width: 850px) {
      header { align-items: flex-start; flex-direction: column; }
      .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>drone-scraper</h1>
        <p class="subtitle">
          iFlight Nazgul und GEPRC Vapor im Preisvergleich.
          Bei iFlight werden zusätzliche 5 % Neukundenrabatt nur
          eingerechnet, wenn der aktuelle Shoppreis nicht bereits reduziert ist.
        </p>
      </div>
      <div>
        <button id="reload">Daten neu laden</button>
        <button id="collect">Jetzt Preise abrufen</button>
      </div>
    </header>

    <section class="overview">
      <article class="stat"><div class="stat-label">Drohnen</div><div class="stat-value" id="count">–</div></article>
      <article class="stat"><div class="stat-label">Lieferbar</div><div class="stat-value" id="available">–</div></article>
      <article class="stat"><div class="stat-label">Bester Preis</div><div class="stat-value" id="best">–</div></article>
      <article class="stat"><div class="stat-label">Letzter Erfolg</div><div class="stat-value" id="last-success">–</div></article>
    </section>

    <section class="section">
      <h2>Aktuelle Preise</h2>
      <div class="grid" id="cards"></div>
    </section>

    <section class="section">
      <h2>Preisverlauf</h2>
      <div class="chart-panel">
        <div class="controls">
          <div class="ranges">
            <button class="range active" data-range="day">24 h</button>
            <button class="range" data-range="week">7 Tage</button>
            <button class="range" data-range="month">30 Tage</button>
            <button class="range" data-range="all">Alles</button>
          </div>
          <label>
            <input id="discount-toggle" type="checkbox" checked>
            5 % iFlight-Neukundenrabatt im Chart einrechnen,
            sofern der Shoppreis nicht bereits reduziert ist
          </label>
        </div>
        <div id="chart"></div>
        <div class="status" id="status">Status wird geladen …</div>
      </div>
    </section>
  </main>

  <script>
    let products = [];
    let rows = [];
    let trackerState = {};
    let selectedRange = "day";

    const money = (value, currency = "EUR") =>
      new Intl.NumberFormat("de-DE", { style: "currency", currency }).format(value);

    const dt = value => {
      if (!value) return "–";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat("de-DE", {
        dateStyle: "short", timeStyle: "short"
      }).format(date);
    };

    const escapeHtml = value =>
      String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    function latestRow(key) {
      const matches = rows
        .filter(row => row.key === key)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      return matches.length ? matches[matches.length - 1] : null;
    }

    function discountEnabled(product) {
      return Boolean(
        document.getElementById("discount-toggle")?.checked &&
        Number(product?.new_account_discount_percent || 0) > 0
      );
    }

    function effectivePrice(row, product, forceDiscount = null) {
      const regular = Number(row?.price);
      if (!Number.isFinite(regular)) return null;

      const percent = Number(product?.new_account_discount_percent || 0);
      const useDiscount =
        forceDiscount === null ? discountEnabled(product) : forceDiscount;

      if (!useDiscount || percent <= 0 || Boolean(row?.shop_discounted)) {
        return regular;
      }

      return regular * (1 - percent / 100);
    }

    function filteredRows() {
      if (selectedRange === "all") return rows;

      const spans = {
        day: 24 * 60 * 60 * 1000,
        week: 7 * 24 * 60 * 60 * 1000,
        month: 30 * 24 * 60 * 60 * 1000
      };
      const cutoff = Date.now() - spans[selectedRange];

      return rows.filter(row => {
        const stamp = new Date(row.timestamp).getTime();
        return Number.isFinite(stamp) && stamp >= cutoff;
      });
    }

    function renderOverview() {
      document.getElementById("count").textContent = String(products.length);

      const latest = products
        .map(product => ({ product, row: latestRow(product.key) }))
        .filter(item => item.row);

      document.getElementById("available").textContent =
        `${latest.filter(item => item.row.available).length}/${products.length}`;

      const priced = latest
        .map(item => ({ ...item, effective: effectivePrice(item.row, item.product) }))
        .filter(item => Number.isFinite(item.effective))
        .sort((a, b) => a.effective - b.effective);

      document.getElementById("best").textContent =
        priced.length ? money(priced[0].effective, priced[0].row.currency) : "–";

      document.getElementById("last-success").textContent =
        dt(trackerState.last_success);
    }

    function renderCards() {
      const target = document.getElementById("cards");

      target.innerHTML = products.map(product => {
        const row = latestRow(product.key);
        const error = trackerState.last_errors?.[product.key];

        if (!row) {
          return `
            <article class="card">
              <div class="card-top">
                <span class="shop">${escapeHtml(product.shop)}</span>
                <span class="badge unavailable">Keine Daten</span>
              </div>
              <h3>${escapeHtml(product.short_name)}</h3>
              <div class="price">–</div>
              <div class="footer">
                <span class="error">${escapeHtml(error || "")}</span>
                <a href="${escapeHtml(product.url)}" target="_blank">Shop öffnen ↗</a>
              </div>
            </article>
          `;
        }

        const regular = Number(row.price);
        const discount = Number(product.new_account_discount_percent || 0);
        const discountApplicable = discount > 0 && !Boolean(row.shop_discounted);
        const shown = discountApplicable
          ? effectivePrice(row, product, true)
          : regular;

        let note = "aktueller Shoppreis";
        let extra = "";

        if (discountApplicable) {
          note = `Shoppreis ${money(regular, row.currency)}`;
          extra = `<div class="discount">Neukundenpreis · −${discount} %</div>`;
        } else if (discount > 0 && row.shop_discounted) {
          note = "bereits reduzierter iFlight-Shoppreis";
          extra = `<div class="discount">Kein zusätzlicher −${discount}-%-Rabatt</div>`;
        }

        return `
          <article class="card">
            <div class="card-top">
              <span class="shop">${escapeHtml(product.shop)}</span>
              <span class="badge ${row.available ? "available" : "unavailable"}">
                ${row.available ? "Lieferbar" : "Nicht lieferbar"}
              </span>
            </div>
            <h3>${escapeHtml(product.short_name)}</h3>
            <div class="price">${money(shown, row.currency)}</div>
            <div class="price-note">${escapeHtml(note)}</div>
            ${extra}
            <div class="meta">
              <span>Variante</span><strong>${escapeHtml(row.variant || "–")}</strong>
              <span>Letzter Messwert</span><strong>${escapeHtml(dt(row.timestamp))}</strong>
            </div>
            <div class="footer">
              <span class="error">${escapeHtml(error || "")}</span>
              <a href="${escapeHtml(product.url || row.url)}" target="_blank" rel="noopener noreferrer">Shop öffnen ↗</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderChart() {
      const visibleRows = filteredRows();

      const traces = products.map(product => {
        const points = visibleRows
          .filter(row => row.key === product.key)
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        const useDiscount = discountEnabled(product);

        return {
          name: useDiscount
            ? `${product.short_name} (−${product.new_account_discount_percent}% falls zulässig)`
            : product.short_name,
          type: "scatter",
          mode: "lines+markers",
          x: points.map(row => row.timestamp),
          y: points.map(row => effectivePrice(row, product)),
          customdata: points.map(row => [
            Number(row.price),
            row.currency,
            row.variant,
            row.available ? "ja" : "nein",
            row.shop_discounted
              ? "Shoppreis bereits reduziert; kein zusätzlicher 5-%-Rabatt"
              : (
                  useDiscount && Number(product.new_account_discount_percent || 0) > 0
                    ? `Neukundenrabatt −${product.new_account_discount_percent}%`
                    : "kein zusätzlicher Rabatt"
                )
          ]),
          hovertemplate:
            "<b>%{fullData.name}</b><br>" +
            "%{x}<br>" +
            "Angezeigt: %{y:.2f} %{customdata[1]}<br>" +
            "Shoppreis: %{customdata[0]:.2f} %{customdata[1]}<br>" +
            "%{customdata[2]}<br>" +
            "Lieferbar: %{customdata[3]}<br>" +
            "%{customdata[4]}<extra></extra>"
        };
      });

      Plotly.react(
        "chart",
        traces,
        {
          paper_bgcolor: "#11151d",
          plot_bgcolor: "#11151d",
          font: { color: "#dce2ec" },
          margin: { l: 65, r: 20, t: 35, b: 65 },
          hovermode: "x unified",
          xaxis: { title: "Zeit", gridcolor: "#252c39" },
          yaxis: { title: "Preis in EUR", gridcolor: "#252c39" },
          legend: { orientation: "h", y: -0.2 }
        },
        { responsive: true, displaylogo: false }
      );
    }

    function renderStatus() {
      const errors = Object.entries(trackerState.last_errors || {});
      document.getElementById("status").textContent =
        trackerState.last_run
          ? `Letzter Abruf: ${dt(trackerState.last_run)} · ${errors.length ? `${errors.length} Fehler` : "ohne Fehler"}`
          : "Noch kein Abruf erfolgt.";
    }

    function renderAll() {
      renderOverview();
      renderCards();
      renderChart();
      renderStatus();
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      return response.json();
    }

    async function load() {
      const [statusData, priceData] = await Promise.all([
        fetchJson("/api/status"),
        fetchJson("/api/prices")
      ]);

      trackerState = statusData;
      products = statusData.products || [];
      rows = priceData || [];
      renderAll();
    }

    document.querySelectorAll(".range").forEach(button => {
      button.addEventListener("click", () => {
        selectedRange = button.dataset.range;
        document.querySelectorAll(".range").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        renderChart();
      });
    });

    document.getElementById("discount-toggle").addEventListener("change", () => {
      renderOverview();
      renderChart();
    });

    document.getElementById("reload").addEventListener("click", load);

    document.getElementById("collect").addEventListener("click", async event => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        await fetchJson("/api/collect", { method: "POST" });
        await load();
      } catch (error) {
        alert(`Preisabruf fehlgeschlagen: ${error.message}`);
      } finally {
        button.disabled = false;
      }
    });

    load().catch(error => {
      document.getElementById("status").textContent = `Fehler: ${error.message}`;
    });

    window.setInterval(() => {
      load().catch(console.error);
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
